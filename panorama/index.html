function entries(){links.replaceChildren();document.querySelector('#hotspots').replaceChildren();hotspots=[];for(let target of graph[current]||[]){const s=scenes[target];let button=document.createElement('button');button.textContent='进入 '+s.name;button.onclick=()=>show(target);links.append(button);let hot=document.createElement('button');hot.className='hotspot';hot.setAttribute('aria-label','进入'+s.name);let arrow=document.createElement('span');arrow.textContent='⌃';hot.append(arrow,document.createTextNode(s.name));hot.onclick=()=>show(target);document.querySelector('#hotspots').append(hot);hotspots.push({target,element:hot})}}
const decodedImages=new Map();for(const [text,action] of [['放大',()=>fov=Math.max(Math.PI/9,fov-.1)],['缩小',()=>fov=Math.min(Math.PI/2.2,fov+.1)],['水平复位',()=>{pitch=0;fov=Math.PI/3}]]){const btn=document.createElement('button');btn.textContent=text;btn.onclick=action;document.querySelector('header').append(btn)}
async function panoramaImage(i){if(decodedImages.has(i))return decodedImages.get(i);const task=(async()=>{const im=new Image();im.src=scenes[i].image;await im.decode();return im})();decodedImages.set(i,task);try{const im=await task;while(decodedImages.size>4){const key=[...decodedImages.keys()].find(k=>k!==i&&k!==current);if(key===undefined)break;decodedImages.delete(key)}return im}catch(e){decodedImages.delete(i);throw e}}
function warmAdjacent(i){setTimeout(()=>{if(current===i)for(const next of (graph[i]||[]).slice(0,2))panoramaImage(next).catch(()=>{})},300)}
async function show(i,{returning=false}={}){if(busy||i===current)return;busy=true;document.body.dataset.busy='true';fail('正在进入 '+scenes[i].name+'…');try{const im=await panoramaImage(i);cv.style.opacity='.2';if(!matchMedia('(prefers-reduced-motion: reduce)').matches)await new Promise(r=>setTimeout(r,180));g.bindTexture(g.TEXTURE_2D,tex);g.texImage2D(g.TEXTURE_2D,0,g.RGB,g.RGB,g.UNSIGNED_BYTE,im);if(current!==null&&!returning)history.push({i:current,yaw,pitch});current=i;yaw=scenes[i].initialYaw??0;pitch=0;sync();entries();const method=scenes[i].method||'';const quality=method.startsWith('Real-ESRGAN')?' AI超分8K':method.startsWith('Lanczos 2x')?' 8K像素·4K无接缝放大':scenes[i].width>=8192?' 原生8K':scenes[i].width<4096?' 快速审阅':' 4K';document.querySelector('#label').textContent=scenes[i].name+' · '+scenes[i].width+'×'+scenes[i].height+quality+(scenes[i].revision<22?' · 上一版待更新':' · 原案恢复版');document.body.dataset.current=scenes[i].name;warmAdjacent(i);fail('')}catch(e){fail('全景加载失败，请重新选择房间。');console.error(e);if(current!==null)sync()}finally{cv.style.opacity='1';busy=false;document.body.dataset.busy='false'}}
rooms.onchange=()=>show(+rooms.value);floors.onchange=()=>{let i=scenes.findIndex(s=>s.floor===floors.value);if(i>=0)show(i)};
back.onclick=async()=>{if(!history.length||busy)return;let h=history[history.length-1];await show(h.i,{returning:true});if(current===h.i){history.pop();yaw=h.yaw;pitch=h.pitch;sync()}};
function bearing(target){let a=scenes[current].position,b=scenes[target].position;return Math.atan2(b[0]-a[0],b[1]-a[1])}
function nearest(){return [...(graph[current]||[])].sort((a,b)=>Math.abs(Math.atan2(Math.sin(bearing(a)+yaw),Math.cos(bearing(a)+yaw)))-Math.abs(Math.atan2(Math.sin(bearing(b)+yaw),Math.cos(bearing(b)+yaw))))[0]}
forward.onclick=()=>{let t=nearest();if(t!==undefined)show(t)};document.querySelector('#full').onclick=()=>{const task=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();task.catch(()=>fail('当前浏览器不支持全屏，请使用浏览器全屏功能。'))};
cv.onpointerdown=e=>{if(spin720Frame)stop720();cv.setPointerCapture(e.pointerId);points.set(e.pointerId,[e.clientX,e.clientY])};
cv.onpointermove=e=>{if(!points.has(e.pointerId))return;const prev=points.get(e.pointerId),divisor=points.size;points.set(e.pointerId,[e.clientX,e.clientY]);yaw-=(e.clientX-prev[0])*.004/divisor;pitch=Math.max(-1.555,Math.min(1.555,pitch+(e.clientY-prev[1])*.004/divisor))};cv.onpointerup=cv.onpointercancel=e=>points.delete(e.pointerId);cv.addEventListener('wheel',e=>{e.preventDefault();fov=Math.max(Math.PI/9,Math.min(Math.PI/2.2,fov+e.deltaY*.0007))},{passive:false});
document.addEventListener('keydown',e=>{if(['SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(['ArrowUp','w'].includes(e.key)){e.preventDefault();forward.click()}if(['ArrowDown','s'].includes(e.key)){e.preventDefault();back.click()}if(e.key==='ArrowLeft'){if(spin720Frame)stop720();yaw+=.12}if(e.key==='ArrowRight'){if(spin720Frame)stop720();yaw-=.12}});
const wm=document.querySelector('#movingWatermark');let wmX=innerWidth*.16,wmY=innerHeight*.25,wmVX=62,wmVY=43,wmLast=performance.now();function moveWatermark(now){const dt=Math.min(.05,(now-wmLast)/1000);wmLast=now;const r=wm.getBoundingClientRect(),maxX=Math.max(0,innerWidth-r.width),maxY=Math.max(0,innerHeight-r.height);wmX+=wmVX*dt;wmY+=wmVY*dt;if(wmX<0||wmX>maxX){wmX=Math.max(0,Math.min(maxX,wmX));wmVX*=-1}if(wmY<0||wmY>maxY){wmY=Math.max(0,Math.min(maxY,wmY));wmVY*=-1}wm.style.transform=`translate3d(${wmX}px,${wmY}px,0)`;requestAnimationFrame(moveWatermark)}addEventListener('resize',()=>{wmX=Math.min(wmX,innerWidth-wm.offsetWidth);wmY=Math.min(wmY,innerHeight-wm.offsetHeight)});requestAnimationFrame(moveWatermark);
function frame(){let w=Math.round(innerWidth*Math.min(devicePixelRatio,2)),h=Math.round(innerHeight*Math.min(devicePixelRatio,2));if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;g.viewport(0,0,w,h)}for(let [k,v] of Object.entries({yaw,pitch,fov,aspect:w/h}))g.uniform1f(g.getUniformLocation(p,k),v);g.drawArrays(g.TRIANGLES,0,6);
for(let hot of hotspots){let theta=bearing(hot.target),elevation=-.35,dx=Math.sin(theta)*Math.cos(elevation),dy=Math.sin(elevation),dz=-Math.cos(theta)*Math.cos(elevation);let x=dx*Math.cos(yaw)-dz*Math.sin(yaw),z=dx*Math.sin(yaw)+dz*Math.cos(yaw),y=dy*Math.cos(pitch)+z*Math.sin(pitch);z=-dy*Math.sin(pitch)+z*Math.cos(pitch);let px=x/(-z*Math.tan(fov/2)*(innerWidth/innerHeight)),py=y/(-z*Math.tan(fov/2));hot.element.hidden=z>=-.05||Math.abs(px)>.85||Math.abs(py)>.7||busy;hot.element.style.left=(px+1)*innerWidth/2+'px';hot.element.style.top=(1-py)*innerHeight/2+'px'}requestAnimationFrame(frame)}const requested=new URLSearchParams(location.search).get('room');show(Math.max(0,scenes.findIndex(s=>s.name===requested)));frame();
