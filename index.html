<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>金兰周府 · 全景浏览</title>
<style>
:root{color-scheme:dark;--ink:#172822;--panel:#213830;--line:#4b6458;--paper:#f5f1e7;--accent:#d8bd78}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--paper);font:16px system-ui,sans-serif}
main{max-width:1120px;margin:auto;padding:clamp(12px,3vw,32px)}header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1{font:700 clamp(26px,4vw,42px) "Songti SC",SimSun,serif;margin:0}header span{color:var(--accent);letter-spacing:.16em}
nav,.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button,select,a.action{font:inherit;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--paper)}
button,a.action{cursor:pointer}a.action{display:inline-flex;align-items:center;text-decoration:none}button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}:focus-visible{outline:3px solid var(--accent);outline-offset:2px}select{max-width:100%}button:disabled{opacity:.5}
figure{position:relative;margin:0;background:#102019;border-radius:8px;overflow:hidden;height:clamp(300px,58vw,620px);border:1px solid var(--line)}
figure img,canvas{display:block;width:100%;height:100%;object-fit:contain}canvas{position:absolute;inset:0;touch-action:none;cursor:grab;object-fit:fill}canvas:active{cursor:grabbing}
figcaption{position:absolute;left:12px;bottom:12px;background:#172822e8;padding:6px 10px;border-radius:4px;pointer-events:none}
[hidden]{display:none!important}small{color:#d4ded6}#message{min-height:1.5em;margin:8px 0}
</style>
<script defer src="lite/scenes.js"></script>
<script defer src="lite/viewer.js"></script>
</head>
<body>
<main>
<header><h1>金兰周府</h1><span>苏辰 · 全景浏览</span></header>
<nav aria-label="查看方式">
<button id="panorama" aria-pressed="true">360° 全景</button>
<button id="top" aria-pressed="false">整屋俯视</button>
<button id="rear" aria-pressed="false">后院鸟瞰</button>
<a class="action" href="model-view/">完整 3D 模型</a>
</nav>
<figure id="view">
<img id="still" src="lite/top.jpg" alt="金兰周府整屋俯视图">
<canvas id="canvas" hidden tabindex="0" aria-label="360度全景，可拖动或按方向键旋转"></canvas>
<figcaption id="caption">整屋俯视</figcaption>
</figure>
<div class="actions">
<label><span>空间 </span><select id="room" aria-label="选择漫游空间" disabled><option>加载中…</option></select></label>
<button id="zoomIn" aria-label="放大">＋</button>
<button id="zoomOut" aria-label="缩小">－</button>
<button id="reset">复位</button>
<a id="original" class="action" href="top.jpg">查看高清图片</a>
</div>
<p id="message" role="status">正在打开全景。可以先查看俯视图。</p>
<small>全景可拖动环视。用双指或 ＋ / － 缩放。俯视与鸟瞰为渲染图，自由旋转建筑请进入完整 3D 模型。</small>
<noscript><p>当前预览未运行交互脚本。<a href="top.jpg">打开整屋俯视原图</a></p></noscript>
</main>
</body>
</html>
